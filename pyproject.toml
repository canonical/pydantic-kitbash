[project]
name = "pydantic-kitbash"
description = "Sphinx extension for documenting Pydantic models."
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["docutils", "pydantic~=2.0", "pyyaml", "sphinx~=7.0"]
dynamic = ["readme", "version"]

[dependency-groups]
dev = [
  "bs4>=0.0.2",
  "build>=0.7.0",
  "coverage[toml]~=7.4",
  "mypy[reports]~=2.4.0",
  "pytest~=9.0",
  "pytest-cov~=7.0",
  "pytest-mock~=3.12",
  "types-Pygments",
  "types-colorama",
  "types-setuptools",
]
docs = [
  "sphinx-lint~=1.0",
  "sphinxext-rediraffe==0.3.0",
  { include-group = "docs-sphinx-stack" },
]
docs-sphinx-stack = [
  "canonical-sphinx~=0.6",
  "myst-parser~=4.0",
  "packaging~=26.1",
  "rst2html>=2020.7.4",
  "sphinx-autobuild>=2024.10.3",
  # "sphinx-config-options~=0.1",
  # "sphinx-contributor-listing~=0.1",
  "sphinx-design==0.6.1",
  # "sphinx-filtered-toctree~=0.1",
  # "sphinx-last-updated-by-git~=0.3",
  "sphinx-llm~=0.4",
  "sphinx-notfound-page~=1.1",
  "sphinx-related-links~=0.1",
  # "sphinx-reredirects==0.1.6",
  "sphinx-rerediraffe>=0.0.3,<1.0.0",
  "sphinx-roles~=0.1",
  "sphinx-sitemap~=2.9",
  # "sphinx-tabs~=3.5",
  "sphinx-terminal~=1.0",
  # "sphinx-ubuntu-images~=0.1",
  # "sphinx-youtube-links~=0.1",
  "sphinxcontrib-jquery~=4.1",
  # "sphinxcontrib-svg2pdfconverter[cairosvg]~=2.1",
  "sphinxext-opengraph~=0.13",
  "vale~=3.13",
]
lint = [
  "mypy>=1.16.0",
]
tics = ["flake8", "pylint"]
types = [
  "mypy[reports]~=2.4.0",
  "types-PyYAML",
  "types-Pygments",
  "types-colorama",
  "types-docutils",
  "types-setuptools",
]

[build-system]
requires = ["setuptools>=69.0", "setuptools_scm[toml]>=7.1"]
build-backend = "setuptools.build_meta"

[tool.codespell]
ignore-words-list = "buildd,crate,keyserver,comandos,ro,dedent,dedented"
skip = ".tox,.git,build,.*_cache,__pycache__,*.tar,*.snap,*.png,./node_modules,./docs/_build,.direnv,.venv,venv,.vscode"
quiet-level = 3
check-filenames = true

[tool.coverage.run]
branch = true
omit = ["tests/**"]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if (typing\\.)?TYPE_CHECKING:"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
exclude = ["build", "results"]
warn_unused_configs = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
warn_return_any = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pydantic_kitbash.*"]
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.pyright]
strict = ["pydantic_kitbash"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
exclude = [
  "**/.*",
  "**/__pycache__",
  "**/_version.py",
]

[tool.pytest.ini_options]
addopts = "--ignore=tests/spread"
markers = ["slow: slow tests"]
minversion = "7.0"
pythonpath = "tests"
testpaths = "tests"
xfail_strict = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["pydantic_kitbash", "tests"]
extend-exclude = ["docs", "*/_version.py"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "D",
  "UP",
  "YTT",
  "ANN",
  "ASYNC",
  "S101",
  "S102",
  "S103",
  "S108",
  "S104",
  "S105",
  "S106",
  "S107",
  "S110",
  "S113",
  "S3",
  "S5",
  "S602",
  "S701",
  "BLE",
  "FBT",
  "B0",
  "A",
  "COM",
  "C4",
  "T10",
  "ISC",
  "ICN",
  "INP",
  "PIE790",
  "PIE794",
  "PIE796",
  "PIE804",
  "PIE807",
  "PIE810",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "TC001",
  "TC002",
  "TC003",
  "TC004",
  "TC005",
  "ARG",
  "PTH",
  "FIX",
  "ERA",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  "PERF",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF005",
  "RUF008",
  "B035",
  "RUF013",
  "RUF100",
  "RUF200",
]
ignore = [
  "E501",
  "D105",
  "D107",
  "D203",
  "D213",
  "D215",
  "A003",
  "SIM117",
  "PLW1641",
  "COM812",
  "ISC001",
  "TRY003",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.pydocstyle]
ignore-decorators = [
  "typing.overload",
  "overrides.override",
  "overrides.overrides",
  "typing.override",
  "typing_extensions.override",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "D",
  "ANN",
  "ARG",
  "S101",
  "S103",
  "S108",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "SLF",
  "FBT001",
  "FBT002",
]
"__init__.py" = [
  "I001",
  "F401",
]

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.packages.find]
include = ["pydantic_kitbash"]
namespaces = false

[tool.setuptools_scm]
write_to = "pydantic_kitbash/_version.py"
version_scheme = "post-release"
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--long",
  "--match",
  "[0-9]*.[0-9]*.[0-9]*",
  "--exclude",
  "*[^0-9.]*",
]

[tool.uv]
constraint-dependencies = [
  "cffi>=1.15",
  "httplib2>=0.20.0",
  "iniconfig>=1.1.0",
  "libnacl>=2.0",
  "lxml>=5.0",
  "markdown>=3.0",
  "markupsafe>=2.0",
  "oauthlib>=3.0.0",
  "protobuf>=5.0",
  "pynacl>=1.5",
  "pyparsing>=3.0.0",
  "pyproject-hooks>=1.0.0",
  "pytz>=2020",
  "pyyaml>=5.0",
  "regex>=2021.11.10",
  "setuptools>=50",
  "soupsieve>=2.9.2",
  "sphinx-basic-ng>=1.0.0b1",
  "starlette>=1.0.1",
  "tornado>=4.0",
  "urllib3>=2.0",
  "webencodings>=0.4.0",
  "wheel>=0.38",
]

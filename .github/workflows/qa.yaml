name: QA
on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  lint:
    uses: canonical/starflow/.github/workflows/lint-python.yaml@work/testing-skill
  test:
    uses: canonical/starflow/.github/workflows/test-python.yaml@work/testing-skill
    with:
      fast-test-python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
